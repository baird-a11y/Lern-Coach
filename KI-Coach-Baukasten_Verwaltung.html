<!doctype html>
<!--
  KI-Coach-Baukasten für die Hochschulverwaltung (Korrespondenz-, Regelwerk- und Organisations-Coach)
  DEMO – Prototyp zur Veranschaulichung, kein offiziell freigegebenes Angebot.

  Basiert auf: „Lern-Coach Baukasten (Umfassend)“ von Marc Lachmann & André Uthmann,
  Moderatoren der Bezirksregierung Düsseldorf (Stand: Oktober 2026),
  lizenziert unter CC BY-NC-SA 3.0 DE – https://creativecommons.org/licenses/by-nc-sa/3.0/de/

  Bearbeitung: Übertragung auf Beschäftigte der Hochschulverwaltung mit Korrespondenz-,
  Regelwerk- und Organisations-Coach, Ausgabe für den KI-Chat der JGU (eigenes Modell), neue Gestaltung.
  Die bearbeitete Fassung steht ebenfalls unter CC BY-NC-SA 3.0 DE.

  Bearbeitung: Paul Baselt, Dezernat Hochschulentwicklung, Johannes Gutenberg-Universität Mainz.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KI-Coach-Baukasten Verwaltung</title>
<style>
  :root{
    --red:#C1002A; --red-dark:#99001F; --red-tint:#FBEAEE;
    --ink:#2B2B2B; --gray:#3C3C3B; --mid:#6E6E6E; --line:#D9D9D9;
    --soft:#F3F3F3; --soft2:#E9E9E9; --white:#FFFFFF;
    --ok:#2E7D4F; --radius:10px;
    --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--soft);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
  a{color:var(--red)}
  button{font:inherit;color:inherit}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px}

  /* Kopf */
  header.top{background:var(--gray);color:var(--white)}
  header.top .wrap{display:flex;align-items:center;gap:14px;padding-top:18px;padding-bottom:18px}
  .logo{width:44px;height:44px;border-radius:8px;background:var(--red);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.5px;flex:none}
  .top h1{margin:0;font-size:22px;line-height:1.2}
  .top p{margin:2px 0 0;font-size:14px;color:#D6D6D6}
  .badge{display:inline-block;vertical-align:middle;margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--white);color:var(--red-dark);font-size:11px;font-weight:800;letter-spacing:.1em}

  main{padding:24px 0 8px}
  .panel{background:var(--white);border-radius:var(--radius);padding:28px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin:0 0 6px}
  h2{font-size:26px;line-height:1.25;margin:0 0 6px;color:var(--gray)}
  h3{font-size:18px;margin:0 0 4px;color:var(--gray)}
  .lead{color:var(--mid);margin:0 0 22px}
  .hidden{display:none !important}

  /* Startseite: Coach-Auswahl */
  .coach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .coach-card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--soft);border:2px solid transparent;border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s, transform .15s}
  .coach-card:hover{border-color:var(--red);transform:translateY(-2px)}
  .coach-card:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  .coach-card .ic{font-size:34px;line-height:1}
  .coach-card h3{font-size:20px}
  .coach-card p{margin:0;color:var(--mid);font-size:15px}
  .coach-card ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--ink)}
  .coach-card .go{margin-top:auto;padding-top:10px;font-weight:700;color:var(--red)}
  .note{background:var(--red-tint);border-radius:var(--radius);padding:14px 16px;margin-top:20px;font-size:15px}
  .note strong{color:var(--red-dark)}
  .demo{border:2px dashed var(--red);border-radius:var(--radius);padding:12px 16px;margin:0 0 20px;font-size:14.5px}
  .demo strong{color:var(--red-dark)}

  /* Reflexion */
  .reflect{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}
  .reflect div{background:var(--soft);border-radius:var(--radius);padding:14px 16px}
  .reflect b{display:block;color:var(--gray)}
  .reflect span{font-size:14px;color:var(--mid)}

  /* Fortschritt */
  .stepper{display:flex;gap:6px;margin:0 0 20px;padding:0;list-style:none;overflow-x:auto;scrollbar-width:thin}
  .stepper li{flex:1 0 auto}
  .stepper button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;min-width:84px;padding:8px 6px;border-radius:8px;font-size:12px;color:var(--mid);text-align:center}
  .stepper button .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft2);font-size:17px}
  .stepper button.done .dot{background:var(--gray);color:#fff}
  .stepper button.current{color:var(--red);font-weight:700}
  .stepper button.current .dot{background:var(--red);color:#fff}
  .stepper button:disabled{cursor:default;opacity:.55}
  .stepper button:focus-visible{outline:3px solid var(--red)}
  .bar{height:6px;border-radius:3px;background:var(--soft2);margin:-10px 0 22px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--red);transition:width .25s}

  /* Optionen */
  .options{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .opt{all:unset;box-sizing:border-box;cursor:pointer;background:var(--soft);border:2px solid transparent;border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
  .opt:hover{border-color:#BDBDBD}
  .opt:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  .opt[aria-pressed="true"]{border-color:var(--red);background:var(--red-tint)}
  .opt .row{display:flex;gap:10px;align-items:flex-start}
  .opt .ic{font-size:24px;line-height:1.1}
  .opt h4{margin:0;font-size:17px;color:var(--gray)}
  .opt .sub{font-size:14px;color:var(--mid);margin:0}
  .opt .ex{margin-top:6px;background:var(--white);border-radius:8px;padding:10px 12px;font-size:13.5px}
  .opt .ex p{margin:0 0 4px}
  .opt .ex p:last-child{margin:0}
  .opt .ex b{color:var(--gray)}
  .opt .ex .c b{color:var(--red)}
  .custom-fields{grid-column:1/-1;background:var(--soft);border-radius:var(--radius);padding:16px 18px;display:grid;gap:10px}
  label.f{display:grid;gap:4px;font-weight:600;font-size:14px;color:var(--gray)}
  input[type=text],textarea{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
  textarea{min-height:70px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--red);border-color:var(--red)}
  .fach{margin:0 0 18px;max-width:520px}
  .hint{font-size:13px;color:var(--mid);font-weight:400}

  /* Navigation */
  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
  .btn{cursor:pointer;border:0;border-radius:8px;padding:11px 20px;font-weight:700;background:var(--red);color:#fff}
  .btn:hover{background:var(--red-dark)}
  .btn:disabled{background:#C9C9C9;cursor:not-allowed}
  .btn.ghost{background:var(--white);color:var(--gray);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--soft)}
  .btn.small{padding:7px 12px;font-size:14px}
  .btn:focus-visible{outline:3px solid var(--gray);outline-offset:2px}
  .err{color:var(--red-dark);font-size:14px;margin:10px 0 0;min-height:1.2em}

  /* Ergebnis */
  .summary{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}
  .chip{all:unset;cursor:pointer;background:var(--soft);border-radius:999px;padding:5px 12px;font-size:13.5px}
  .chip:hover,.chip:focus-visible{background:var(--soft2);outline:2px solid var(--line)}
  .chip b{color:var(--gray)}
  .tabs{display:flex;gap:4px;border-bottom:2px solid var(--soft2);margin:6px 0 18px;flex-wrap:wrap}
  .tab{all:unset;cursor:pointer;padding:10px 14px;font-weight:700;color:var(--mid);border-bottom:3px solid transparent;margin-bottom:-2px}
  .tab[aria-selected="true"]{color:var(--red);border-color:var(--red)}
  .tab:focus-visible{outline:2px solid var(--red)}
  .howto{margin:0 0 18px;padding-left:22px}
  .howto li{margin-bottom:6px}
  .field{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
  .field-head{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);padding:8px 12px}
  .field-head span{font-weight:700;font-size:14px;color:var(--gray)}
  .field pre,.field .val{margin:0;padding:12px 14px;white-space:pre-wrap;word-wrap:break-word;font-family:var(--font);font-size:14px;max-height:420px;overflow:auto}
  .field pre{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:13px;line-height:1.55}
  .guard{background:var(--soft);border-radius:var(--radius);padding:14px 18px;margin:0 0 18px;font-size:14.5px}
  .guard h4{margin:0 0 6px;color:var(--gray)}
  .guard ul{margin:0;padding-left:20px}
  .tip{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
  .tip>div{border-radius:var(--radius);padding:14px 16px;font-size:14.5px}
  .tip .a{background:var(--soft)}
  .tip .b{background:var(--red-tint)}
  .tip h4{margin:0 0 6px;color:var(--gray)}
  .tip .b h4{color:var(--red-dark)}
  .tip ul{margin:4px 0 0;padding-left:20px}
  details.md{margin-top:10px;font-size:14px}
  details.md summary{cursor:pointer;color:var(--red);font-weight:600}
  .row-btns{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gray);color:#fff;padding:10px 18px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}

  /* Fuß / Lizenz */
  footer.lic{margin:22px auto 30px;font-size:13px;color:var(--mid)}
  footer.lic .panel{padding:18px 22px}
  footer.lic p{margin:0 0 6px}
  footer.lic b{color:var(--gray)}

  @media (max-width:820px){
    .coach-grid{grid-template-columns:1fr}
    .options,.reflect,.tip{grid-template-columns:1fr}
    .panel{padding:20px 16px}
    h2{font-size:22px}
  }
  @media print{
    header.top,.nav,.stepper,.bar,.tabs,.btn,.row-btns{display:none !important}
    body{background:#fff}
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="logo" aria-hidden="true">KI</div>
    <div>
      <h1>KI-Coach-Baukasten · Verwaltung <span class="badge">DEMO</span></h1>
      <p>Bauen Sie sich Ihren persönlichen KI-Coach für die Hochschulverwaltung – Texte, Regelwerke, Organisation</p>
    </div>
  </div>
</header>

<main class="wrap" id="app" aria-live="polite"></main>

<footer class="lic wrap">
  <div class="panel" id="license"></div>
</footer>

<div class="toast" id="toast" role="status"></div>

<script>
/* =====================================================================
   Bearbeiter:in – hier eintragen (erscheint im Lizenzhinweis)
   ===================================================================== */
const ADAPTED_BY = "Paul Baselt, Dezernat Hochschulentwicklung, Johannes Gutenberg-Universität Mainz";
const ADAPTED_DATE = "Oktober 2026";

/* =====================================================================
   Inhalte
   ===================================================================== */
const LICENSE_URL = "https://creativecommons.org/licenses/by-nc-sa/3.0/de/";

/* greetQ und greet: [Du-Form, Sie-Form] – welche genutzt wird, hängt vom Ton ab */
const COACHES = {
  korrespondenz: {
    label: "Korrespondenz-Coach", icon: "✉️",
    teaser: "Hilft Ihnen, E-Mails, Schreiben und Infotexte klar, freundlich und verständlich zu formulieren.",
    bullets: ["Entwirft und überarbeitet Texte", "Verständlich statt Amtsdeutsch", "Erfindet keine Fakten oder Fristen"],
    reflectTitle: "Denken Sie an eine Nachricht, die richtig gut angekommen ist",
    reflectText: "Eine E-Mail, ein Anschreiben oder ein Infotext, auf den Sie positive Rückmeldung bekommen haben – oder bei dem keine Rückfragen kamen.",
    reflect: [
      ["Was hat den Text verständlich gemacht?", "Kurze Sätze? Klare Struktur? Konkrete nächste Schritte?"],
      ["Wo hakt es bei Ihnen meistens?", "Der Einstieg? Der richtige Ton? Zu lang? Heikle Inhalte?"],
      ["Wer liest Ihre Texte?", "Studierende? Kolleg:innen? Externe? Die Hochschulleitung?"],
      ["Was soll Ihre Aufgabe bleiben?", "Was wollen Sie immer selbst entscheiden und prüfen?"],
    ],
    specific: ["adressaten", "textart", "mitarbeit"],
    greetQ: ["Welchen Text möchtest du schreiben oder überarbeiten – und an wen geht er?", "Welchen Text möchten Sie schreiben oder überarbeiten – und an wen geht er?"],
    suggestions: ["Formuliere diese E-Mail freundlicher und kürzer", "Hilf mir, eine Absage verständlich zu formulieren", "Mach aus diesem Text eine verständliche FAQ"],
    rules: [
      "Erfinde keine Fakten, Fristen, Zuständigkeiten, Paragraphen oder Kontaktdaten. Wo Angaben fehlen, setze deutlich markierte Platzhalter wie [FRIST] oder [ANSPRECHPERSON].",
      "Rechtsverbindliche Texte (z. B. Bescheide, Verträge, Rechtsbehelfsbelehrungen) formulierst du nicht eigenständig. Weise darauf hin, dass dafür die geltenden Vorlagen und die zuständige Stelle maßgeblich sind.",
      "Erinnere mich daran, jeden Entwurf vor dem Versand inhaltlich zu prüfen – die Verantwortung für den Text liegt bei mir.",
    ],
  },
  regelwerk: {
    label: "Regelwerk-Coach", icon: "⚖️",
    teaser: "Hilft Ihnen, Ordnungen, Richtlinien und Vorschriften zu verstehen und Fragen dazu zu klären.",
    bullets: ["Erklärt Regeln in klarer Sprache", "Arbeitet mit dem Originaltext", "Ersetzt keine Rechtsauskunft"],
    reflectTitle: "Denken Sie an eine Regelung, die Ihnen Kopfzerbrechen bereitet hat",
    reflectText: "Eine Prüfungsordnung, eine Richtlinie, eine Dienstvereinbarung – oder eine Anfrage, bei der Sie erst nachlesen mussten.",
    reflect: [
      ["Was war schwierig?", "Verschachtelte Sätze? Verweise auf andere Paragraphen? Ausnahmen?"],
      ["Wie sind Sie zur Antwort gekommen?", "Nachlesen? Kolleg:innen fragen? Die Rechtsabteilung?"],
      ["Was hätte Ihnen geholfen?", "Eine Zusammenfassung? Ein Beispielfall? Eine Übersicht?"],
      ["Wo endet Ihre Zuständigkeit?", "Welche Fragen gehören zu einer anderen Stelle?"],
    ],
    specific: ["regelungen", "regelaufgabe", "quellenbezug"],
    greetQ: ["Um welche Regelung geht es – und welche Frage möchtest du klären? Am besten fügst du den Text gleich mit ein.", "Um welche Regelung geht es – und welche Frage möchten Sie klären? Am besten fügen Sie den Text gleich mit ein."],
    suggestions: ["Fasse diese Regelung in klarer Sprache zusammen", "Welche Paragraphen sind für diesen Fall relevant?", "Was hat sich zwischen alter und neuer Fassung geändert?"],
    rules: [
      "Du gibst keine verbindliche Rechtsauskunft. Weise bei rechtlich unklaren oder folgenreichen Fragen darauf hin, die zuständige Stelle (z. B. Rechtsabteilung, Prüfungsausschuss, Personalabteilung) einzubeziehen.",
      "Erfinde niemals Paragraphen, Fristen oder Inhalte von Regelwerken. Wenn ich keinen Text bereitstelle, sag deutlich, dass du dich auf allgemeines Wissen stützt, das veraltet oder falsch sein kann, und dass die aktuelle amtliche Fassung maßgeblich ist.",
      "Trenne in deinen Antworten klar zwischen dem, was im Text steht, und deiner Auslegung oder Einschätzung.",
    ],
  },
  orga: {
    label: "Organisations-Coach", icon: "🗂️",
    teaser: "Unterstützt Sie beim Planen, Strukturieren und Priorisieren – von der Besprechung bis zum Prozess.",
    bullets: ["Strukturiert Aufgaben und Abläufe", "Bereitet Besprechungen vor und nach", "Entscheidet nicht für Sie"],
    reflectTitle: "Denken Sie an ein Vorhaben, das richtig gut gelaufen ist",
    reflectText: "Eine Veranstaltung, ein neues Verfahren, eine Semesterplanung, ein Umzug – etwas, bei dem am Ende alles gepasst hat.",
    reflect: [
      ["Was hat den Erfolg ausgemacht?", "Ein klarer Plan? Gute Absprachen? Genug Puffer?"],
      ["Wo geht bei Ihnen am meisten Zeit verloren?", "Abstimmungen? Suchen? Unterbrechungen? Doppelte Arbeit?"],
      ["Wie behalten Sie den Überblick?", "Listen? Kalender? Tools? Im Kopf?"],
      ["Was soll bei Ihnen bleiben?", "Welche Entscheidungen treffen nur Sie?"],
    ],
    specific: ["schwerpunkt", "format", "vorgehen"],
    greetQ: ["Woran arbeitest du gerade – und was soll am Ende dabei herauskommen?", "Woran arbeiten Sie gerade – und was soll am Ende dabei herauskommen?"],
    suggestions: ["Hilf mir, meine Aufgaben für diese Woche zu priorisieren", "Erstelle eine Agenda für unsere Teambesprechung", "Beschreibe diesen Ablauf als Checkliste"],
    rules: [
      "Entscheidungen über Personal, Budget oder Prioritäten triffst du nicht. Du zeigst Optionen mit Vor- und Nachteilen auf; die Entscheidung liegt bei mir bzw. der zuständigen Leitung.",

      "Wenn Abläufe Mitbestimmung, Datenschutz oder Haushaltsrecht berühren, weise darauf hin, die zuständigen Stellen (z. B. Personalrat, Datenschutzbeauftragte:r, Haushaltsabteilung) frühzeitig einzubeziehen.",
    ],
  },
};

/* Regeln, die in jedem Prompt stehen */
const COMMON_RULES = [
  "Sei ehrlich statt gefällig: Benenne Schwächen, Unklarheiten und Risiken klar, auch wenn ich nur Bestätigung suche.",
  "Datenschutz: Wenn ich personenbezogene Daten (z. B. Namen, Matrikelnummern, Noten, Personal- oder Gesundheitsdaten) eingebe, weise mich darauf hin und bitte mich, sie zu entfernen oder durch Platzhalter zu ersetzen.",
  "Vertraulichkeit: Wenn ich interne, vertrauliche Unterlagen (z. B. Gremien-, Personal-, Vergabe- oder Vertragsunterlagen) einfügen möchte, erinnere mich daran, vorher zu prüfen, ob das zulässig ist.",
  "Die fachliche und rechtliche Verantwortung bleibt bei mir: Kennzeichne Unsicherheiten offen und empfiehl bei wichtigen Vorgängen eine Prüfung nach dem Vier-Augen-Prinzip.",
  "Bei Konflikten am Arbeitsplatz oder starker Belastung gehst du nicht ins Detail, sondern verweist freundlich auf passende Ansprechpersonen (z. B. Führungskraft, Personalrat, Beratungsangebote für Beschäftigte).",
];

const DIALOG = [
  "Halte Antworten kurz: meist 2–5 Sätze oder eine kurze Liste. Textentwürfe dürfen so lang sein, wie der Text es braucht.",
  "Dialog statt Monolog: Stelle Rückfragen, wenn wichtige Angaben fehlen, statt Annahmen zu treffen.",
  "Stelle immer nur eine Frage auf einmal.",
  "Längere Erklärungen nur, wenn ich ausdrücklich darum bitte.",
  "Nutze Markdown (Überschriften, **Fettdruck**, Listen, Tabellen), wenn es die Übersicht verbessert.",
];

/* Schritte. tpl = Baustein für den Prompt; ex = Beispieldialog */
const STEPS = {
  bereich: {
    icon: "🏛️", short: "Bereich", title: "Ihr Arbeitsbereich", q: "In welcher Rolle arbeiten Sie – und in welchem Bereich?", fach: true,
    customLabels: ["Rolle", "Beschreibung"],
    options: [
      { id: "sachbearbeitung", icon: "📋", title: "Sachbearbeitung", sub: "Vorgänge bearbeiten, Anfragen beantworten",
        ex: ["Ich bekomme täglich ähnliche Anfragen.", "Dann entwickeln wir einen Textbaustein, den Sie schnell anpassen können. Welche Anfrage kommt am häufigsten?"],
        tpl: "Ich arbeite in der Sachbearbeitung: Ich bearbeite Vorgänge, beantworte Anfragen und wende Regelungen im Einzelfall an. Hilf mir, schnell, korrekt und nachvollziehbar zu arbeiten." },
      { id: "sekretariat", icon: "☎️", title: "Sekretariat & Assistenz", sub: "Organisieren, koordinieren, kommunizieren",
        ex: ["Ich koordiniere Termine für zwölf Personen.", "Klären wir zuerst: Welche Termine stehen fest, und wo gibt es Spielraum?"],
        tpl: "Ich arbeite im Sekretariat bzw. in der Assistenz: Ich koordiniere Termine, organisiere Abläufe und bin Anlaufstelle für viele Anfragen. Hilf mir, den Überblick zu behalten und effizient zu kommunizieren." },
      { id: "referat", icon: "🧩", title: "Referat & Stabsstelle", sub: "Konzepte, Vorlagen, Projekte",
        ex: ["Ich soll eine Vorlage für die Hochschulleitung schreiben.", "Gut. Was soll am Ende entschieden werden – und welche Optionen gibt es?"],
        tpl: "Ich arbeite als Referent:in bzw. in einer Stabsstelle: Ich erarbeite Konzepte, Entscheidungsvorlagen und Projekte. Unterstütze mich beim Strukturieren, Argumentieren und Abwägen." },
      { id: "leitung", icon: "🧭", title: "Leitung & Koordination", sub: "Team führen, priorisieren, entscheiden",
        ex: ["Mein Team ist überlastet.", "Sammeln wir die laufenden Aufgaben und sortieren sie nach Dringlichkeit und Wirkung."],
        tpl: "Ich habe eine Leitungs- oder Koordinationsfunktion: Ich führe ein Team, setze Prioritäten und treffe Entscheidungen. Unterstütze mich dabei, strukturiert zu planen und klar zu kommunizieren." },
    ],
  },
  persoenlichkeit: {
    icon: "🎭", short: "Persönlichkeit", title: "Persönlichkeit", q: "Wer soll Ihr Coach sein?",
    customLabels: ["Rolle", "Beschreibung"],
    options: [

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);

function stepValid(id){

  if (sel === "custom"){ const cu = state.custom[id] || {}; if (!(cu.title || "").trim() || !(cu.desc || "").trim()) return false; }
  if (STEPS[id].fach && !state.fach.trim()) return false;

}

    const card = h("button", { class: "opt", type: "button", "aria-pressed": pressed ? "true" : "false", onclick: () => { state.sel[id] = o.id; render(); const again = app.querySelector(`[data-opt="${o.id}"]`); if (again) again.focus(); }, "data-opt": o.id },
      h("div", { class: "row" }, h("span", { class: "ic", "aria-hidden": "true" }, o.icon), h("div", null, h("h4", null, o.title), h("p", { class: "sub" }, o.sub))),

function opt(id){
  const sel = state.sel[id];
  if (sel === "custom"){ const cu = state.custom[id]; return { title: cu.title.trim(), tpl: cu.desc.trim(), custom: true }; }
  return STEPS[id].options.find(o => o.id === sel);
}
function defaultName(){ return "Mein " + COACHES[state.coach].label; }
function coachName(){ return (state.name || "").trim() || defaultName(); }

function greeting(){
  const p = opt("persoenlichkeit"), c = COACHES[state.coach];
  const sie = !!(opt("ton") || {}).sie, i = sie ? 1 : 0;
  const hi = (p && p.greet) ? p.greet[i] : (sie ? "Guten Tag! Schön, dass Sie da sind." : "Hallo! Schön, dass du da bist.");
  return `${hi} ${c.greetQ[i]}`;
}

function sections(){
  const c = COACHES[state.coach];
  const out = [];
  out.push(["ZIELGRUPPE", `Kontext: Verwaltung einer Universität, Bereich ${state.fach.trim()}. ${opt("bereich").tpl}`]);
  out.push(["ROLLE UND PERSÖNLICHKEIT", opt("persoenlichkeit").tpl]);
  out.push(["KOMMUNIKATIONSSTIL", opt("ton").tpl]);
  c.specific.forEach(sid => out.push([STEPS[sid].title.toUpperCase(), opt(sid).tpl]));
  out.push(["FEEDBACK", opt("feedback").tpl]);
  return out;
}

function systemPrompt(){
  const c = COACHES[state.coach];
  const parts = [`Du bist „${coachName()}“, ein KI-${c.label} für Beschäftigte in der Hochschulverwaltung.`, ""];
  for (const [t, body] of sections()){ parts.push(`# ${t}`, body, ""); }
  parts.push("# DIALOG-PRINZIP", ...DIALOG.map(d => "- " + d), "");
  parts.push("# LEITPLANKEN (gelten immer)", ...c.rules.map(r => "- " + r), ...COMMON_RULES.map(r => "- " + r), "");
  parts.push("# GESPRÄCHSSTART", `Antworte auf meine erste Nachricht, indem du dich kurz vorstellst und fragst: „${greeting()}“ – außer meine erste Nachricht enthält bereits ein konkretes Anliegen; dann geh direkt darauf ein.`);
  return parts.join("\n");
}
function universalPrompt(){
  return systemPrompt() + "\n\n---\n\nBestätige kurz, dass du die Rolle übernimmst, und beginne dann mit: „" + greeting() + "“";

function description(){
  const c = COACHES[state.coach];
  return `${c.label} für ${state.fach.trim()} (${opt("bereich").title}) – ${opt("persoenlichkeit").title}, ${opt(c.specific[0]).title}.`;
}
function suggestions(){
  const c = COACHES[state.coach], list = [];
  for (const sid of c.specific){ const o = opt(sid); if (o && o.suggest) list.push(o.suggest); }
  for (const s of c.suggestions) if (!list.includes(s)) list.push(s);
  return list.slice(0, 3);
