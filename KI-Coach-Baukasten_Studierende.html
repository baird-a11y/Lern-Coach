<!doctype html>
<!--
  KI-Coach-Baukasten für Studierende (Lern-, Schreib- und Recherche-Coach)

  Basiert auf: „Lern-Coach Baukasten (Umfassend)“ von Marc Lachmann & André Uthmann,
  Moderatoren der Bezirksregierung Düsseldorf (Stand: Oktober 2026),
  lizenziert unter CC BY-NC-SA 3.0 DE – https://creativecommons.org/licenses/by-nc-sa/3.0/de/

  Bearbeitung: Anpassung an Studierende, Erweiterung um Schreib- und Recherche-Coach,
  Ausgabe für den KI-Chat der JGU (eigenes Modell), neue Gestaltung.
  Die bearbeitete Fassung steht ebenfalls unter CC BY-NC-SA 3.0 DE.

  Bearbeitung: Paul Baselt, Dezernat Hochschulentwicklung, Johannes Gutenberg-Universität Mainz.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KI-Coach-Baukasten</title>
<style>
  :root{
    --red:#C1002A; --red-dark:#99001F; --red-tint:#FBEAEE;
    --ink:#2B2B2B; --gray:#3C3C3B; --mid:#6E6E6E; --line:#D9D9D9;
    --soft:#F3F3F3; --soft2:#E9E9E9; --white:#FFFFFF;
    --ok:#2E7D4F; --radius:10px;
    --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--soft);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
  a{color:var(--red)}
  button{font:inherit;color:inherit}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px}

  /* Kopf */
  header.top{background:var(--gray);color:var(--white)}
  header.top .wrap{display:flex;align-items:center;gap:14px;padding-top:18px;padding-bottom:18px}
  .logo{width:44px;height:44px;border-radius:8px;background:var(--red);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.5px;flex:none}
  .top h1{margin:0;font-size:22px;line-height:1.2}
  .top p{margin:2px 0 0;font-size:14px;color:#D6D6D6}

  main{padding:24px 0 8px}
  .panel{background:var(--white);border-radius:var(--radius);padding:28px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin:0 0 6px}
  h2{font-size:26px;line-height:1.25;margin:0 0 6px;color:var(--gray)}
  h3{font-size:18px;margin:0 0 4px;color:var(--gray)}
  .lead{color:var(--mid);margin:0 0 22px}
  .hidden{display:none !important}

  /* Startseite: Coach-Auswahl */
  .coach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .coach-card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--soft);border:2px solid transparent;border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s, transform .15s}
  .coach-card:hover{border-color:var(--red);transform:translateY(-2px)}
  .coach-card:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  .coach-card .ic{font-size:34px;line-height:1}
  .coach-card h3{font-size:20px}
  .coach-card p{margin:0;color:var(--mid);font-size:15px}
  .coach-card ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--ink)}
  .coach-card .go{margin-top:auto;padding-top:10px;font-weight:700;color:var(--red)}
  .note{background:var(--red-tint);border-radius:var(--radius);padding:14px 16px;margin-top:20px;font-size:15px}
  .note strong{color:var(--red-dark)}

  /* Reflexion */
  .reflect{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}
  .reflect div{background:var(--soft);border-radius:var(--radius);padding:14px 16px}
  .reflect b{display:block;color:var(--gray)}
  .reflect span{font-size:14px;color:var(--mid)}

  /* Fortschritt */
  .stepper{display:flex;gap:6px;margin:0 0 20px;padding:0;list-style:none;overflow-x:auto;scrollbar-width:thin}
  .stepper li{flex:1 0 auto}
  .stepper button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;min-width:84px;padding:8px 6px;border-radius:8px;font-size:12px;color:var(--mid);text-align:center}
  .stepper button .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft2);font-size:17px}
  .stepper button.done .dot{background:var(--gray);color:#fff}
  .stepper button.current{color:var(--red);font-weight:700}
  .stepper button.current .dot{background:var(--red);color:#fff}
  .stepper button:disabled{cursor:default;opacity:.55}
  .stepper button:focus-visible{outline:3px solid var(--red)}
  .bar{height:6px;border-radius:3px;background:var(--soft2);margin:-10px 0 22px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--red);transition:width .25s}

  /* Optionen */
  .options{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .opt{all:unset;box-sizing:border-box;cursor:pointer;background:var(--soft);border:2px solid transparent;border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
  .opt:hover{border-color:#BDBDBD}
  .opt:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  .opt[aria-pressed="true"]{border-color:var(--red);background:var(--red-tint)}
  .opt .row{display:flex;gap:10px;align-items:flex-start}
  .opt .ic{font-size:24px;line-height:1.1}
  .opt h4{margin:0;font-size:17px;color:var(--gray)}
  .opt .sub{font-size:14px;color:var(--mid);margin:0}
  .opt .ex{margin-top:6px;background:var(--white);border-radius:8px;padding:10px 12px;font-size:13.5px}
  .opt .ex p{margin:0 0 4px}
  .opt .ex p:last-child{margin:0}
  .opt .ex b{color:var(--gray)}
  .opt .ex .c b{color:var(--red)}
  .custom-fields{grid-column:1/-1;background:var(--soft);border-radius:var(--radius);padding:16px 18px;display:grid;gap:10px}
  label.f{display:grid;gap:4px;font-weight:600;font-size:14px;color:var(--gray)}
  input[type=text],textarea{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
  textarea{min-height:70px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--red);border-color:var(--red)}
  .fach{margin:0 0 18px;max-width:520px}
  .hint{font-size:13px;color:var(--mid);font-weight:400}

  /* Navigation */
  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
  .btn{cursor:pointer;border:0;border-radius:8px;padding:11px 20px;font-weight:700;background:var(--red);color:#fff}
  .btn:hover{background:var(--red-dark)}
  .btn:disabled{background:#C9C9C9;cursor:not-allowed}
  .btn.ghost{background:var(--white);color:var(--gray);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--soft)}
  .btn.small{padding:7px 12px;font-size:14px}
  .btn:focus-visible{outline:3px solid var(--gray);outline-offset:2px}
  .err{color:var(--red-dark);font-size:14px;margin:10px 0 0;min-height:1.2em}

  /* Ergebnis */
  .summary{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}
  .chip{all:unset;cursor:pointer;background:var(--soft);border-radius:999px;padding:5px 12px;font-size:13.5px}
  .chip:hover,.chip:focus-visible{background:var(--soft2);outline:2px solid var(--line)}
  .chip b{color:var(--gray)}
  .tabs{display:flex;gap:4px;border-bottom:2px solid var(--soft2);margin:6px 0 18px;flex-wrap:wrap}
  .tab{all:unset;cursor:pointer;padding:10px 14px;font-weight:700;color:var(--mid);border-bottom:3px solid transparent;margin-bottom:-2px}
  .tab[aria-selected="true"]{color:var(--red);border-color:var(--red)}
  .tab:focus-visible{outline:2px solid var(--red)}
  .howto{margin:0 0 18px;padding-left:22px}
  .howto li{margin-bottom:6px}
  .field{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
  .field-head{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);padding:8px 12px}
  .field-head span{font-weight:700;font-size:14px;color:var(--gray)}
  .field pre,.field .val{margin:0;padding:12px 14px;white-space:pre-wrap;word-wrap:break-word;font-family:var(--font);font-size:14px;max-height:420px;overflow:auto}
  .field pre{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:13px;line-height:1.55}
  .guard{background:var(--soft);border-radius:var(--radius);padding:14px 18px;margin:0 0 18px;font-size:14.5px}
  .guard h4{margin:0 0 6px;color:var(--gray)}
  .guard ul{margin:0;padding-left:20px}
  .tip{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
  .tip>div{border-radius:var(--radius);padding:14px 16px;font-size:14.5px}
  .tip .a{background:var(--soft)}
  .tip .b{background:var(--red-tint)}
  .tip h4{margin:0 0 6px;color:var(--gray)}
  .tip .b h4{color:var(--red-dark)}
  .tip ul{margin:4px 0 0;padding-left:20px}
  details.md{margin-top:10px;font-size:14px}
  details.md summary{cursor:pointer;color:var(--red);font-weight:600}
  .row-btns{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gray);color:#fff;padding:10px 18px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}

  /* Fuß / Lizenz */
  footer.lic{margin:22px auto 30px;font-size:13px;color:var(--mid)}
  footer.lic .panel{padding:18px 22px}
  footer.lic p{margin:0 0 6px}
  footer.lic b{color:var(--gray)}

  @media (max-width:820px){
    .coach-grid{grid-template-columns:1fr}
    .options,.reflect,.tip{grid-template-columns:1fr}
    .panel{padding:20px 16px}
    h2{font-size:22px}
  }
  @media print{
    header.top,.nav,.stepper,.bar,.tabs,.btn,.row-btns{display:none !important}
    body{background:#fff}
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="logo" aria-hidden="true">KI</div>
    <div>
      <h1>KI-Coach-Baukasten</h1>
      <p>Baue dir deinen persönlichen KI-Coach fürs Studium – Lernen, Schreiben, Recherchieren</p>
    </div>
  </div>
</header>

<main class="wrap" id="app" aria-live="polite"></main>

<footer class="lic wrap">
  <div class="panel" id="license"></div>
</footer>

<div class="toast" id="toast" role="status"></div>

<script>
/* =====================================================================
   Bearbeiter:in – hier eintragen (erscheint im Lizenzhinweis)
   ===================================================================== */
const ADAPTED_BY = "Paul Baselt, Dezernat Hochschulentwicklung, Johannes Gutenberg-Universität Mainz";
const ADAPTED_DATE = "Oktober 2026";

/* =====================================================================
   Inhalte
   ===================================================================== */
const LICENSE_URL = "https://creativecommons.org/licenses/by-nc-sa/3.0/de/";

const COACHES = {

    teaser: "Versteht mit dir Inhalte, fragt dich ab und hilft beim Lernen für Klausuren.",
    bullets: ["Erklärt in deinem Tempo", "Fragt dich ab statt vorzusagen", "Hilft, wenn du feststeckst"],
    reflectTitle: "Denk an eine Lernsituation, die richtig gut war",

    reflect: [
      ["Wie war die Person, die dir geholfen hat?", "Geduldig? Fordernd? Locker? Strukturiert?"],
      ["Wie hat sie erklärt?", "Mit Fragen? Schritt für Schritt? Mit Beispielen?"],
      ["Was passierte bei Fehlern?", "Neue Erklärung? Ein Tipp? Noch ein Versuch?"],

    ],
  },
  schreib: {
    label: "Schreib-Coach", icon: "✍️",
    teaser: "Begleitet dich von der Fragestellung bis zur Überarbeitung – ohne für dich zu schreiben.",
    bullets: ["Hilft beim Strukturieren", "Gibt ehrliches Feedback", "Schreibt nicht für dich"],

    rules: [
      "Schreibe keine Texte oder Textteile, die ich als eigene Prüfungsleistung abgeben könnte – keine ganzen Absätze, Kapitel oder fertigen Gliederungen zum Übernehmen.",
      "Erfinde keine Zitate, Belege oder Literaturangaben.",
      "Wenn KI-Unterstützung in eine Prüfungsleistung einfließt, erinnere mich daran, die Regeln meiner Lehrenden zu prüfen und die Nutzung zu kennzeichnen.",

  },
  recherche: {
    label: "Recherche-Coach", icon: "🔎",

    bullets: ["Entwickelt Suchstrategien", "Bewertet Quellen mit dir", "Erfindet keine Literatur"],
    reflectTitle: "Denk an deine letzte Recherche",
    reflectText: "Für ein Referat, eine Hausarbeit oder einfach aus Interesse: Wie bist du vorgegangen?",
    reflect: [
      ["Wo hast du gesucht?", "Google? UB-Katalog? Fachdatenbanken? Literaturlisten?"],
      ["Was war schwierig?", "Zu viele Treffer? Zu wenige? Die richtigen Begriffe?"],
      ["Woran erkennst du eine gute Quelle?", "Autor:in? Verlag? Aktualität? Belege?"],
      ["Was würdest du gern besser können?", "Eingrenzen? Suchen? Bewerten? Ordnen?"],
    ],
    specific: ["recherchephase", "quellen", "erfahrung"],
    greetQ: "Zu welchem Thema recherchierst du – und was hast du schon gefunden?",
    suggestions: ["Hilf mir, mein Thema einzugrenzen", "Entwickle mit mir Suchbegriffe für den UB-Katalog", "Wie bewerte ich diese Quelle?"],
    rules: [
      "Nenne niemals Literaturangaben (Autor:in, Titel, Jahr, Zeitschrift) als Tatsache, wenn du sie nicht sicher überprüfen kannst. Gib mir stattdessen Suchbegriffe, Suchstrategien, Datenbanken und Bewertungskriterien.",
      "Wenn du doch konkrete Titel nennst, kennzeichne sie ausdrücklich als ungeprüft und fordere mich auf, sie im Katalog der Universitätsbibliothek oder in einer Fachdatenbank zu prüfen.",
      "Erkläre Suchschritte so, dass ich sie selbst nachvollziehen und wiederholen kann.",

  },

/* Regeln, die in jedem Prompt stehen */
const COMMON_RULES = [
  "Sei ehrlich statt gefällig: Benenne Schwächen und Fehler klar, auch wenn ich nur Bestätigung suche.",
  "Datenschutz: Wenn ich personenbezogene Daten anderer Menschen (z. B. Namen, Noten, Interview- oder Umfragedaten) oder sensible Daten eingebe, weise mich darauf hin und bitte mich, sie zu anonymisieren.",
  "Urheberrecht: Wenn ich lizenzierte E-Books, Zeitschriftenartikel oder Materialien von Lehrenden hochladen möchte, erinnere mich daran, dass das meist nicht erlaubt ist – eigene Notizen und Open-Access-Texte sind in Ordnung.",

const DIALOG = [
  "Halte Antworten kurz: meist 2–5 Sätze oder eine kurze Liste.",
  "Dialog statt Monolog: Stelle nach jedem Schritt eine Rückfrage, statt alles auf einmal zu erklären.",
  "Stelle immer nur eine Frage auf einmal.",
  "Längere Erklärungen nur, wenn ich ausdrücklich darum bitte.",
  "Nutze Markdown (Überschriften, **Fettdruck**, Listen, Tabellen), wenn es die Übersicht verbessert.",
];

/* Schritte. tpl = Baustein für den Prompt; ex = Beispieldialog */
const STEPS = {
  studium: {
    icon: "🎓", short: "Studium", title: "Dein Studium", q: "In welcher Studienphase bist du – und was studierst du?", fach: true,

    options: [
      { id: "einstieg", icon: "🌱", title: "Studieneinstieg", sub: "1.–2. Semester",

      { id: "bachelor", icon: "📘", title: "Bachelor, fortgeschritten", sub: "ab dem 3. Semester",

      { id: "master", icon: "📕", title: "Master", sub: "vertieftes Fachwissen",
        ex: ["Ich will die Methode kritisch einordnen.", "Gut. Auf welche Grenzen der Methode willst du dich konzentrieren – Validität, Übertragbarkeit oder Annahmen?"],
        tpl: "Ich studiere im Master. Setze solides Fachwissen voraus, arbeite auf wissenschaftlichem Niveau und fordere mich zu kritischer Reflexion heraus." },
      { id: "abschluss", icon: "🎯", title: "Abschlussphase", sub: "Bachelor- oder Masterarbeit",
        ex: ["Ich stecke mitten in meiner Abschlussarbeit.", "Dann lass uns gezielt arbeiten. Was ist gerade der größte Engpass?"],

    ],
  },
  persoenlichkeit: {
    icon: "🎭", short: "Persönlichkeit", title: "Persönlichkeit", q: "Wer soll dein Coach sein?",
    customLabels: ["Rolle", "Beschreibung"],
    options: [
      { id: "tutor", icon: "😊", title: "Geduldige:r Tutor:in", sub: "Ruhig, verlässlich, nimmt sich Zeit",

      { id: "motivator", icon: "🔥", title: "Motivierende:r Coach", sub: "Energie, Zuversicht, Fortschritt sichtbar machen",

/* =====================================================================
   Zustand
   ===================================================================== */
const state = { view: "home", coach: null, step: 0, sel: {}, custom: {}, fach: "", name: "", tab: "kichat", maxStep: 0 };
const app = document.getElementById("app");

function stepsFor(c){ const s = COACHES[c].specific; return ["studium", "persoenlichkeit", "ton", ...s, "feedback"]; }

/* Kleine DOM-Helfer */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()){ if (kid == null || kid === false) continue; el.append(kid.nodeType ? kid : document.createTextNode(kid)); }
  return el;
}
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800); }
function focusTop(){ const t = app.querySelector("h2"); if (t){ t.setAttribute("tabindex", "-1"); t.focus({ preventScroll: true }); } window.scrollTo({ top: 0, behavior: "smooth" }); }

/* Kopieren mit Ersatzweg (z. B. wenn Moodle die Seite im iframe zeigt) */
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast("✓ In die Zwischenablage kopiert"); return; } catch(e){}
  const ta = h("textarea", { "aria-hidden": "true", style: "position:fixed;top:-1000px;opacity:0" }); ta.value = text; document.body.append(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch(e){}
  ta.remove();
  toast(ok ? "✓ In die Zwischenablage kopiert" : "Kopieren nicht möglich – bitte Text markieren und mit Strg+C kopieren");
}
function download(filename, text){
  try {
    const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
    const a = h("a", { href: URL.createObjectURL(blob), download: filename }); document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  } catch(e){ toast("Download nicht möglich – bitte stattdessen kopieren"); }
}

/* =====================================================================
   Ansichten
   ===================================================================== */
function render(){
  app.innerHTML = "";
  if (state.view === "home") renderHome();
  else if (state.view === "intro") renderIntro();
  else if (state.view === "wizard") renderWizard();
  else renderResult();
}

function renderHome(){
  const grid = h("div", { class: "coach-grid" });
  for (const [id, c] of Object.entries(COACHES)){
    grid.append(h("button", { class: "coach-card", type: "button", onclick: () => { start(id); } },
      h("span", { class: "ic", "aria-hidden": "true" }, c.icon),
      h("h3", null, c.label),
      h("p", null, c.teaser),
      h("ul", null, c.bullets.map(b => h("li", null, b))),
      h("span", { class: "go" }, "Coach bauen →")));
  }
  app.append(h("section", { class: "panel" },
    h("p", { class: "eyebrow" }, "KI im Studium"),
    h("h2", null, "Welchen Coach möchtest du bauen?"),
    h("p", { class: "lead" }, "In 7 kurzen Schritten stellst du dir einen KI-Coach zusammen, der zu dir und deinem Studium passt. Am Ende bekommst du einen fertigen Prompt – zum Beispiel für ein eigenes Modell im KI-Chat der JGU."),
    grid,
    h("div", { class: "note" },
      h("strong", null, "Gut zu wissen: "),
      "Jeder Coach hat feste Leitplanken eingebaut – er erfindet keine Quellen, schreibt keine Prüfungsleistungen für dich und erinnert dich an Datenschutz und Urheberrecht. Ob und wie du KI in Prüfungen nutzen darfst, entscheiden deine Lehrenden.")));
}

function start(id){
  state.coach = id; state.step = 0; state.maxStep = 0; state.sel = {}; state.custom = {}; state.name = "";
  state.view = "intro"; render(); focusTop();
}

function renderIntro(){
  const c = COACHES[state.coach];
  app.append(h("section", { class: "panel" },
    h("p", { class: "eyebrow" }, c.label + " · Bevor wir starten"),
    h("h2", null, "🤔 " + c.reflectTitle),
    h("p", { class: "lead" }, c.reflectText + " Nimm dir einen Moment und denk über diese Fragen nach:"),
    h("div", { class: "reflect" }, c.reflect.map(([b, s]) => h("div", null, h("b", null, b), h("span", null, s)))),
    h("p", null, "Diese Gedanken helfen dir, deinen Coach so zu gestalten, dass er wirklich zu dir passt."),
    h("div", { class: "nav" },
      h("button", { class: "btn ghost", type: "button", onclick: () => { state.view = "home"; render(); focusTop(); } }, "← Anderer Coach"),
      h("button", { class: "btn", type: "button", onclick: () => { state.view = "wizard"; render(); focusTop(); } }, "Los geht's →"))));
}

function stepValid(id){
  const sel = state.sel[id];
  if (!sel) return false;
  if (sel === "custom"){ const cu = state.custom[id] || {}; if (!(cu.title || "").trim() || !(cu.desc || "").trim()) return false; }
  if (STEPS[id].fach && !state.fach.trim()) return false;
  return true;
}

function renderWizard(){
  const c = COACHES[state.coach], ids = stepsFor(state.coach), id = ids[state.step], st = STEPS[id];
  const panel = h("section", { class: "panel" });

  // Fortschritt
  const ol = h("ol", { class: "stepper", "aria-label": "Fortschritt" });
  ids.forEach((sid, i) => {
    const done = stepValid(sid) && i !== state.step;
    ol.append(h("li", null, h("button", { type: "button", class: (i === state.step ? "current " : "") + (done ? "done" : ""), disabled: i > state.maxStep,
      "aria-current": i === state.step ? "step" : null, onclick: () => { state.step = i; render(); focusTop(); } },
      h("span", { class: "dot", "aria-hidden": "true" }, STEPS[sid].icon), STEPS[sid].short)));
  });
  panel.append(ol, h("div", { class: "bar", "aria-hidden": "true" }, h("i", { style: `width:${((state.step + 1) / ids.length) * 100}%` })));

  panel.append(h("p", { class: "eyebrow" }, `${c.label} · Schritt ${state.step + 1} von ${ids.length}`), h("h2", null, `${st.icon} ${st.title}`), h("p", { class: "lead" }, st.q));

  if (st.fach){
    const inp = h("input", { type: "text", id: "fach", placeholder: "z. B. Politikwissenschaft, Chemie, Lehramt Deutsch/Geschichte", autocomplete: "off" });
    inp.value = state.fach;
    inp.addEventListener("input", () => { state.fach = inp.value; updateNext(); });
    panel.append(h("label", { class: "f fach", for: "fach" }, "Dein Studienfach", inp));
  }

  const grid = h("div", { class: "options", role: "group", "aria-label": st.title });
  const all = [...st.options, { id: "custom", icon: "✏️", title: "Eigene Option", sub: "Beschreibe selbst, was du dir wünschst" }];
  all.forEach(o => {
    const pressed = state.sel[id] === o.id;
    const card = h("button", { class: "opt", type: "button", "aria-pressed": pressed ? "true" : "false", onclick: () => { state.sel[id] = o.id; render(); const again = app.querySelector(`[data-opt="${o.id}"]`); if (again) again.focus(); }, "data-opt": o.id },
      h("div", { class: "row" }, h("span", { class: "ic", "aria-hidden": "true" }, o.icon), h("div", null, h("h4", null, o.title), h("p", { class: "sub" }, o.sub))),
      o.ex ? h("div", { class: "ex" }, h("p", null, h("b", null, "Du: "), "„" + o.ex[0] + "“"), h("p", { class: "c" }, h("b", null, "Coach: "), "„" + o.ex[1] + "“")) : null);
    grid.append(card);
  });
  if (state.sel[id] === "custom"){
    const cu = state.custom[id] = state.custom[id] || { title: "", desc: "" };
    const t = h("input", { type: "text", id: "cu-t" }); t.value = cu.title; t.addEventListener("input", () => { cu.title = t.value; updateNext(); });
    const d = h("textarea", { id: "cu-d", placeholder: "Beschreibe in 1–3 Sätzen, wie sich dein Coach verhalten soll." }); d.value = cu.desc; d.addEventListener("input", () => { cu.desc = d.value; updateNext(); });
    grid.append(h("div", { class: "custom-fields" },
      h("label", { class: "f", for: "cu-t" }, st.customLabels[0], t),
      h("label", { class: "f", for: "cu-d" }, st.customLabels[1], h("span", { class: "hint" }, "Wird so in den Prompt übernommen – schreib es als Anweisung an den Coach."), d)));
  }
  panel.append(grid);

  const err = h("p", { class: "err", id: "err" });
  const next = h("button", { class: "btn", type: "button", id: "next", onclick: () => {
    if (!stepValid(id)){ err.textContent = !state.sel[id] ? "Bitte wähle eine Option." : (st.fach && !state.fach.trim()) ? "Bitte gib dein Studienfach an." : "Bitte fülle beide Felder der eigenen Option aus."; return; }
    if (state.step < ids.length - 1){ state.step++; state.maxStep = Math.max(state.maxStep, state.step); render(); focusTop(); }
    else { state.view = "result"; state.maxStep = ids.length - 1; if (!state.name) state.name = defaultName(); render(); focusTop(); }
  } }, state.step < ids.length - 1 ? "Weiter →" : "✨ Coach erstellen");
  panel.append(err, h("div", { class: "nav" },
    h("button", { class: "btn ghost", type: "button", onclick: () => { if (state.step === 0){ state.view = "intro"; } else state.step--; render(); focusTop(); } }, "← Zurück"),
    next));
  app.append(panel);
  updateNext();
}
function updateNext(){
  const ids = stepsFor(state.coach), id = ids[state.step], n = document.getElementById("next"), e = document.getElementById("err");
  if (n) n.disabled = !stepValid(id);
  if (e && stepValid(id)) e.textContent = "";
}

/* =====================================================================
   Prompt bauen
   ===================================================================== */
function opt(id){
  const sel = state.sel[id];
  if (sel === "custom"){ const cu = state.custom[id]; return { title: cu.title.trim(), tpl: cu.desc.trim(), custom: true }; }
  return STEPS[id].options.find(o => o.id === sel);
}
function defaultName(){ return "Mein " + COACHES[state.coach].label; }
function coachName(){ return (state.name || "").trim() || defaultName(); }

function greeting(){
  const p = opt("persoenlichkeit"), c = COACHES[state.coach];
  const hi = (p && p.greet) || "Hallo! Schön, dass du da bist.";
  let q = c.greetQ;
  const ton = state.sel.ton;
  if (ton === "akademisch") q = q.replace(/arbeitest du/g, "arbeiten Sie").replace(/steckst du/g, "stecken Sie").replace(/recherchierst du/g, "recherchieren Sie").replace(/hast du/g, "haben Sie").replace(/ist dein Ziel/g, "ist Ihr Ziel");
  const hi2 = ton === "akademisch" ? hi.replace("dass du da bist", "dass Sie da sind").replace("dich herauszufordern", "Sie herauszufordern") : hi;
  return `${hi2} ${q}`;
}

function sections(){
  const c = COACHES[state.coach], ids = stepsFor(state.coach);
  const stud = opt("studium");
  const out = [];
  out.push(["ZIELGRUPPE", `Ich studiere ${state.fach.trim()}. ${stud.tpl}`]);
  out.push(["ROLLE UND PERSÖNLICHKEIT", opt("persoenlichkeit").tpl]);
  out.push(["KOMMUNIKATIONSSTIL", opt("ton").tpl]);
  c.specific.forEach(sid => out.push([STEPS[sid].title.toUpperCase(), opt(sid).tpl]));
  out.push(["FEEDBACK", opt("feedback").tpl]);
  return out;
}

function systemPrompt(){
  const c = COACHES[state.coach];
  const parts = [`Du bist „${coachName()}“, ein KI-${c.label} für Studierende.`, ""];
  for (const [t, body] of sections()){ parts.push(`# ${t}`, body, ""); }
  parts.push("# DIALOG-PRINZIP", ...DIALOG.map(d => "- " + d), "");
  parts.push("# LEITPLANKEN (gelten immer)", ...c.rules.map(r => "- " + r), ...COMMON_RULES.map(r => "- " + r), "");
  parts.push("# GESPRÄCHSSTART", `Antworte auf meine erste Nachricht, indem du dich kurz vorstellst und fragst: „${greeting()}“ – außer meine erste Nachricht enthält bereits eine konkrete Frage; dann geh direkt darauf ein.`);
  return parts.join("\n");
}
function universalPrompt(){
  return systemPrompt() + "\n\n---\n\nBestätige kurz, dass du die Rolle übernimmst, und beginne dann mit: „" + greeting() + "“";
}
function description(){
  const c = COACHES[state.coach];
  return `${c.label} für ${state.fach.trim()} (${opt("studium").title}) – ${opt("persoenlichkeit").title}, ${opt(c.specific[0]).title}.`;
}
function suggestions(){
  const c = COACHES[state.coach], list = [];
  for (const sid of c.specific){ const o = opt(sid); if (o && o.suggest) list.push(o.suggest); }
  for (const s of c.suggestions) if (!list.includes(s)) list.push(s);
  return list.slice(0, 3);
}
function today(){ return new Date().toLocaleDateString("de-DE"); }
function nachweis(){
  const c = COACHES[state.coach];
  return `KI-Nutzungsnachweis

Für [Titel der Arbeit / Prüfungsleistung] habe ich am [Datum, z. B. ${today()}] einen selbst konfigurierten KI-${c.label} („${coachName()}“) im KI-Chat der JGU (ki-chat.uni-mainz.de, Basismodell: [Modellname]) genutzt.

Zweck: [z. B. Feedback zur Gliederung / Abfragen des Klausurstoffs / Entwicklung von Suchbegriffen]
Betroffene Teile der Arbeit: [Kapitel/Abschnitte oder „keine direkten Übernahmen“]
Eigene Leistung: [Was habe ich selbst erarbeitet, geprüft oder verändert?]

Der verwendete Systemprompt und die Chatverläufe sind im Anhang dokumentiert.`;
}
function markdown(){
  const c = COACHES[state.coach];
  return `# ${coachName()} – KI-${c.label}

> Erstellt mit dem KI-Coach-Baukasten am ${today()}.
> Basiert auf dem „Lern-Coach Baukasten“ von Marc Lachmann & André Uthmann (Bezirksregierung Düsseldorf), CC BY-NC-SA 3.0 DE; bearbeitet von ${ADAPTED_BY}.

## Beschreibung
${description()}

## Systemprompt
\`\`\`
${systemPrompt()}
\`\`\`

## Prompt-Vorschläge
${suggestions().map(s => "- " + s).join("\n")}

## So richtest du den Coach im KI-Chat der JGU ein
1. ki-chat.uni-mainz.de öffnen und mit dem JGU-Account anmelden.
2. Im Arbeitsbereich ein neues Modell anlegen (eigenes Modell individualisieren).

4. Optional: die Prompt-Vorschläge hinterlegen. Speichern – fertig.

}

      h("div", { class: "row-btns" }, h("button", { class: "btn", type: "button", onclick: () => download(fileName(), markdown()) }, "⬇️ Alles als Markdown herunterladen")),
